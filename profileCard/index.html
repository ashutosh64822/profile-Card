<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- card container  -->
      <div class="profile-card">
        <button class="theme-btn">Dark Theme</button>

        <!-- profile img section  -->
        <div class="profile-img">
          <div>
            <img
              src="https://scontent.fcgp33-1.fna.fbcdn.net/v/t39.30808-6/760701305_1009071175287893_6641979236256348585_n.jpg?stp=dst-jpg_tt6&cstp=mx960x959&ctp=s960x959&_nc_cat=107&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=6ee11a&_nc_ohc=PHrtDHbWJ4sQ7kNvwG1j0xv&_nc_oc=Adpw-MjNd9lQf6z53fUqGbp8WPai1SSIusvFQdc_3sqGHiRaQjH8hRCvF6nf2wjOO8A&_nc_zt=23&_nc_ht=scontent.fcgp33-1.fna&_nc_gid=Yx7TYS5K0XshyUG4z9rDUg&_nc_ss=7b2a8&oh=00_AQPL0WAyKhYHFSP_0VEOaS1e_TnsqizIqiRP2MeIBCXHdQ&oe=6AC12F71"
              alt="Profile Picture"
            />
          </div>
        </div>
<!-- profile information section  -->
        <div class="profile-info">
          <h1 class="profile-title">Ashutosh Roy</h1>
          <p class="profile-username">@ashutoshroy</p>
          <p class="profession">Web Developer</p>
          <div class="skills">
            <p class="skill">HTML</p>
            <p class="skill">CSS</p>
            <p class="skill">JavaScript</p>
          </div>
          <p class="profile-bio">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Eos,
            perspiciatis.
          </p>
        </div>
        <div class="profile-stats">
          <p><span class="followCount">000</span> Following</p>
          <p><span class="followCount">000</span> followers</p>
          <p><span class="likeCount">0</span> Like</p>
        </div>
        <!-- profile action btns  -->
        <div class="profile-actions">
          <button class="follow-btn">Follow</button>
          <button class="message-btn">Message</button>
          <button class="likeBtn">Like</button>
        </div>
        <!-- message write container  -->
        <div id="msgContainer" class="messageContainer">
          <input type="text" id="inputMsg" maxlength="100" />
          <button id="sendMsg">Send</button>
          <br />
          <span class="charCount">0<span>/100</span></span>
        </div>
        <!-- display msg section  -->
        <div class="displayMsg"></div>
      </div>
    </main>
    <script src="scripts/main.js"></script>
  </body>
</html>
